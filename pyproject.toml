[project]
name = "patient-simulation-system"
version = "0.1.0"
description = "CRC patient communication simulation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pydantic==2.13.3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "pywin32>=311; sys_platform == 'win32'",
  "uvicorn==0.46.0",
  "websockets>=15,<17",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]
